apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: posttrainx-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: posttrainx-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
# For GPU inference, prefer custom metrics such as queue depth, p95 TTFT, or KV-cache utilization.
# CPU HPA is intentionally only shown for the stateless API tier.
