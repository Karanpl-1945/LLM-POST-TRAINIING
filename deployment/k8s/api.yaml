apiVersion: apps/v1
kind: Deployment
metadata:
  name: posttrainx-api
spec:
  replicas: 3
  selector:
    matchLabels: {app: posttrainx-api}
  template:
    metadata:
      labels: {app: posttrainx-api}
    spec:
      containers:
        - name: api
          image: YOUR_REGISTRY/posttrainx-api:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: VLLM_BASE_URL, value: "http://posttrainx-vllm:8000/v1"}
            - {name: VLLM_API_KEY, valueFrom: {secretKeyRef: {name: posttrainx-secrets, key: vllm-api-key}}}
            - {name: MODEL_ID, value: "posttrainx"}
            - {name: REDIS_URL, value: "redis://redis:6379/0"}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: "250m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
---
apiVersion: v1
kind: Service
metadata:
  name: posttrainx-api
spec:
  selector: {app: posttrainx-api}
  ports:
    - {name: http, port: 80, targetPort: 8080}
