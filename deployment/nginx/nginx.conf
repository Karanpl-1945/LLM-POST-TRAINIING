events { worker_connections 4096; }

http {
    upstream chat_api {
        least_conn;
        server api:8080 max_fails=3 fail_timeout=10s;
    }

    # Edge protection. Tune these numbers from real traffic/SLA data.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 80;
        client_max_body_size 2m;

        location = /healthz {
            proxy_pass http://chat_api/healthz;
        }

        location / {
            limit_req zone=per_ip burst=20 nodelay;
            limit_conn addr 20;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;          # important for token streaming
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_pass http://chat_api;
        }
    }
}
