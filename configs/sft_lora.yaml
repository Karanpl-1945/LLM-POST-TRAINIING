seed: 42
model:
  id: Qwen/Qwen2.5-0.5B
  dtype: bf16
  trust_remote_code: false

dataset:
  source: hf
  name: YOUR_HF_SFT_DATASET
  train_split: train
  messages_field: messages
  eval_fraction: 0.01

peft:
  method: lora
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  bias: none

training:
  output_dir: outputs/sft-lora
  num_train_epochs: 1
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 0.0002
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  max_grad_norm: 1.0
  max_length: 2048
  packing: true
  packing_strategy: bfd
  assistant_only_loss: false
  gradient_checkpointing: true
  precision: bf16
  tf32: true
  logging_steps: 10
  save_steps: 250
  eval_steps: 250
  save_total_limit: 2
  dataset_num_proc: 4
  report_to: none
