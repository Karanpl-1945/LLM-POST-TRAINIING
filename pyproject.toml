[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "posttrainx"
version = "0.1.0"
description = "End-to-end LLM post-training and serving reference project: PySpark preprocessing, LoRA/QLoRA SFT, DPO, vLLM serving, and benchmarking."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Your Name"}]
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.7",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.46",
  "datasets>=3.0",
  "accelerate>=1.0",
  "peft>=0.13",
  "trl>=0.15",
  "bitsandbytes>=0.44; platform_system == 'Linux'",
  "sentencepiece>=0.2",
]
spark = ["pyspark>=3.5,<4.1"]
serve = [
  "vllm>=0.8; platform_system == 'Linux'",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "openai>=1.50",
  "redis>=5.0",
  "httpx>=0.27",
]
eval = ["numpy>=1.26"]
dev = ["pytest>=8.0", "ruff>=0.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
